name: 工作流程提案
description: 基於具體的協作失敗案例，提出可重複使用的改進。
title: "[提案] "
labels: [enhancement]
body:
  - type: textarea
    id: failure
    attributes:
      label: 失敗或採用問題
      description: 發生了什麼事？現有行為為什麼不夠用？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 提案變更與邊界
      description: 說明哪個模式、模板、參考文件或腳本需要修改，以及哪些應保持選用。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 驗證方式
      description: 描述行為測試或可觀察結果。
    validations:
      required: true
